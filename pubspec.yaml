  #    دانلود کن و در پوشه‌ی assets/fonts/ بگذار.
  # ۲) بلوک زیر را از حالت کامنت خارج کن و دوباره `flutter pub get` بزن.
  #    تم اپ از قبل روی خانواده‌ی 'Vazirmatn' تنظیم شده است.
